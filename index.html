<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九九乘法語音測驗 (iOS穩定版)</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f4f8;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 15px;
        }
        .card {
            background: #ffffff; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 25px; width: 100%; max-width: 480px; text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 15px; font-size: 24px; }
        .setting-group { margin: 15px 0; font-size: 18px; color: #34495e; }
        input[type="number"] {
            font-size: 20px; padding: 6px; width: 70px; text-align: center;
            border: 2px solid #3498db; border-radius: 8px; outline: none;
        }
        .btn {
            background-color: #3498db; color: white; border: none;
            padding: 14px 20px; font-size: 18px; font-weight: bold;
            border-radius: 12px; cursor: pointer; width: 100%; margin-top: 10px;
        }
        .btn-mic {
            background-color: #e67e22; font-size: 22px; padding: 16px;
            margin-bottom: 10px; box-shadow: 0 4px 10px rgba(230, 126, 34, 0.3);
        }
        .btn-mic.listening {
            background-color: #e74c3c; animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .progress-bar-container {
            width: 100%; background-color: #ecf0f1; height: 10px;
            border-radius: 5px; overflow: hidden; margin-bottom: 15px;
        }
        .progress-bar { height: 100%; background-color: #2ecc71; width: 100%; transition: width 0.1s linear; }
        .stats-box {
            display: flex; justify-content: space-around; background: #f8f9fa;
            padding: 10px; border-radius: 10px; margin-bottom: 15px; font-weight: bold;
        }
        .correct-text { color: #27ae60; }
        .wrong-text { color: #e74c3c; }
        .question-box { font-size: 52px; font-weight: bold; color: #2c3e50; margin: 10px 0; }
        .status-msg { font-size: 16px; min-height: 24px; color: #7f8c8d; font-weight: bold; margin-bottom: 5px; }
        .recognized-text { font-size: 15px; color: #8e44ad; min-height: 22px; margin-bottom: 10px; }
        .hidden { display: none; }
        
        .time-stamp {
            background: #eef2f7; padding: 8px 12px; border-radius: 8px;
            font-size: 15px; color: #4a5568; margin-top: 10px;
            display: inline-block; font-weight: 500;
        }
        .numpad {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px;
        }
        .num-btn {
            background: #edf2f7; border: 1px solid #cbd5e0; font-size: 20px;
            font-weight: bold; padding: 12px; border-radius: 8px; color: #2d3748;
        }
        .num-btn:active { background: #cbd5e0; }
    </style>
</head>
<body>

<div class="card">
    <!-- 開始畫面 -->
    <div id="start-screen">
        <h1>九九乘法語音測驗</h1>
        <p style="color: #7f8c8d; font-size: 14px;">請確認 iPad 已開啟「設定 > 一般 > 鍵盤 > 啟用聽寫」。</p>
        
        <div class="setting-group">
            <label for="time-limit">每題思考時間：</label>
            <input type="number" id="time-limit" value="5" min="2" max="10"> 秒
        </div>

        <button class="btn" onclick="startQuiz()">開始測驗</button>
    </div>

    <!-- 測驗進行畫面 -->
    <div id="quiz-screen" class="hidden">
        <div class="stats-box">
            <div>題數：<span id="current-q">1</span>/25</div>
            <div class="correct-text">對：<span id="score-correct">0</span></div>
            <div class="wrong-text">錯：<span id="score-wrong">0</span></div>
        </div>

        <div class="progress-bar-container">
            <div id="timer-bar" class="progress-bar"></div>
        </div>

        <div class="question-box" id="question-text">? × ?</div>
        
        <button id="mic-btn" class="btn btn-mic" onclick="toggleListening()">🎙️ 點此開口回答</button>

        <div class="status-msg" id="status-msg">請點擊上方按鈕後回答</div>
        <div class="recognized-text" id="recognized-text"></div>

        <details open>
            <summary style="color: #7f8c8d; font-size: 14px; cursor: pointer; margin-bottom: 8px;">數字鍵盤 (隨時可點擊)</summary>
            <div class="numpad">
                <button class="num-btn" onclick="manualInput(1)">1</button>
                <button class="num-btn" onclick="manualInput(2)">2</button>
                <button class="num-btn" onclick="manualInput(3)">3</button>
                <button class="num-btn" onclick="manualInput(4)">4</button>
                <button class="num-btn" onclick="manualInput(5)">5</button>
                <button class="num-btn" onclick="manualInput(6)">6</button>
                <button class="num-btn" onclick="manualInput(7)">7</button>
                <button class="num-btn" onclick="manualInput(8)">8</button>
                <button class="num-btn" onclick="manualInput(9)">9</button>
                <button class="num-btn" onclick="manualInput(0)">0</button>
                <button class="num-btn" style="grid-column: span 2; background: #feb2b2;" onclick="clearInput()">清除</button>
            </div>
        </details>
    </div>

    <!-- 結束結算畫面 -->
    <div id="result-screen" class="hidden">
        <h1>🎉 測驗完成！</h1>
        <div class="time-stamp">
            📅 完成時間：<span id="final-datetime">--</span>
        </div>

        <div style="font-size: 20px; margin: 20px 0; text-align: left; padding: 0 30px;">
            <p>答對題數：<span class="correct-text" id="final-correct" style="font-weight: bold;">0</span> / 25 題</p>
            <p>答錯題數：<span class="wrong-text" id="final-wrong" style="font-weight: bold;">0</span> 題</p>
            <p>整體正確率：<span id="final-accuracy" style="color: #2980b9; font-weight: bold;">0%</span></p>
        </div>

        <button class="btn" onclick="resetQuiz()">重新測驗</button>
    </div>
</div>

<script>
    let currentQuestion = 0, totalQuestions = 25;
    let correctCount = 0, wrongCount = 0;
    let num1 = 0, num2 = 0, correctAnswer = 0;
    let timeLimit = 5, timerInterval = null, remainingTime = 0;
    let isAnswering = false, isListening = false;
    let recognition = null;
    let inputBuffer = "";

    function initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return false;
        
        if (!recognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = function() {
                isListening = true;
                const btn = document.getElementById('mic-btn');
                if (btn) {
                    btn.classList.add('listening');
                    btn.innerText = "聆聽中...請說話";
                }
                document.getElementById('status-msg').innerText = "請清晰說出答案數字";
            };

            recognition.onresult = function(event) {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('recognized-text').innerText = '聽到：' + transcript;
                let parsedNum = parseChineseNumber(transcript);
                if (parsedNum !== null) {
                    checkAnswer(parsedNum);
                }
            };

            recognition.onerror = function(e) {
                stopListeningUI();
            };

            recognition.onend = function() {
                stopListeningUI();
            };
        }
        return true;
    }

    function toggleListening() {
        if (!isAnswering) return;
        initSpeech();

        if (isListening) {
            safeStopSpeech();
        } else {
            safeStartSpeech();
        }
    }

    function safeStartSpeech() {
        if (!recognition) return;
        try {
            recognition.start();
        } catch(e) {
            // 如果語音狀態異常，先強制停止再啟動
            safeStopSpeech();
            setTimeout(() => {
                try { recognition.start(); } catch(err) {}
            }, 200);
        }
    }

    function safeStopSpeech() {
        if (!recognition) return;
        try { recognition.stop(); } catch(e) {}
        stopListeningUI();
    }

    function stopListeningUI() {
        isListening = false;
        const btn = document.getElementById('mic-btn');
        if (btn) {
            btn.classList.remove('listening');
            btn.innerText = "🎙️ 點此開口回答";
        }
    }

    function startQuiz() {
        let inputTime = parseInt(document.getElementById('time-limit').value);
        timeLimit = (isNaN(inputTime) || inputTime < 2) ? 2 : (inputTime > 10 ? 10 : inputTime);
        
        currentQuestion = 0; correctCount = 0; wrongCount = 0;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');

        initSpeech();
        nextQuestion();
    }

    function nextQuestion() {
        safeStopSpeech();
        if (currentQuestion >= totalQuestions) { endQuiz(); return; }

        currentQuestion++;
        isAnswering = true;
        inputBuffer = "";

        num1 = Math.floor(Math.random() * 8) + 2;
        num2 = Math.floor(Math.random() * 8) + 2;
        correctAnswer = num1 * num2;

        document.getElementById('current-q').innerText = currentQuestion;
        document.getElementById('score-correct').innerText = correctCount;
        document.getElementById('score-wrong').innerText = wrongCount;
        document.getElementById('question-text').innerText = `${num1} × ${num2}`;
        document.getElementById('status-msg').innerText = "點擊按鈕開口，或使用下方鍵盤";
        document.getElementById('status-msg').style.color = "#34495e";
        document.getElementById('recognized-text').innerText = "";

        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        remainingTime = timeLimit * 1000;
        const bar = document.getElementById('timer-bar');
        if (bar) bar.style.width = '100%';

        timerInterval = setInterval(() => {
            remainingTime -= 50;
            if (bar) bar.style.width = Math.max(0, (remainingTime / (timeLimit * 1000)) * 100) + '%';
            if (remainingTime <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 50);
    }

    function handleTimeout() {
        if (!isAnswering) return;
        isAnswering = false;
        safeStopSpeech();

        wrongCount++;
        document.getElementById('score-wrong').innerText = wrongCount;
        document.getElementById('status-msg').innerText = `⏰ 時間到！答案是 ${correctAnswer}`;
        document.getElementById('status-msg').style.color = "#e74c3c";

        setTimeout(nextQuestion, 1200);
    }

    function checkAnswer(userAnswer) {
        if (!isAnswering) return;

        if (userAnswer === correctAnswer) {
            isAnswering = false;
            clearInterval(timerInterval);
            safeStopSpeech();

            correctCount++;
            document.getElementById('score-correct').innerText = correctCount;
            document.getElementById('status-msg').innerText = "⭕ 答對了！";
            document.getElementById('status-msg').style.color = "#27ae60";

            setTimeout(nextQuestion, 800);
        }
    }

    function manualInput(val) {
        if (!isAnswering) return;
        inputBuffer += val.toString();
        document.getElementById('recognized-text').innerText = '按鍵輸入：' + inputBuffer;
        checkAnswer(parseInt(inputBuffer, 10));
    }

    function clearInput() {
        inputBuffer = "";
        document.getElementById('recognized-text').innerText = "";
    }

    function endQuiz() {
        isAnswering = false;
        clearInterval(timerInterval);
        safeStopSpeech();

        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        const now = new Date();
        const formattedDateTime = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
        document.getElementById('final-datetime').innerText = formattedDateTime;

        document.getElementById('final-correct').innerText = correctCount;
        document.getElementById('final-wrong').innerText = wrongCount;
        document.getElementById('final-accuracy').innerText = Math.round((correctCount / totalQuestions) * 100) + '%';
    }

    function resetQuiz() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    function parseChineseNumber(text) {
        text = text.trim();
        let digits = text.match(/\d+/);
        if (digits) return parseInt(digits[0], 10);

        const cnMap = { '零':0, '一':1, '二':2, '兩':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9 };
        if (text.includes('十')) {
            let parts = text.split('十');
            let tens = parts[0] === '' ? 1 : cnMap[parts[0]];
            let ones = parts[1] === '' ? 0 : cnMap[parts[1]];
            if (tens !== undefined && ones !== undefined) return tens * 10 + ones;
        }
        let chars = text.split('');
        if (chars.length === 2 && cnMap[chars[0]] !== undefined && cnMap[chars[1]] !== undefined) {
            return cnMap[chars[0]] * 10 + cnMap[chars[1]];
        }
        if (chars.length === 1 && cnMap[chars[0]] !== undefined) {
            return cnMap[chars[0]];
        }
        return null;
    }
</script>

</body>
</html>
