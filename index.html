<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>九九乘法語音測驗 (iOS版)</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 { color: #2c3e50; margin-bottom: 15px; font-size: 26px; }
        .setting-group {
            margin: 20px 0;
            font-size: 18px;
            color: #34495e;
        }
        input[type="number"] {
            font-size: 20px;
            padding: 8px;
            width: 80px;
            text-align: center;
            border: 2px solid #3498db;
            border-radius: 8px;
            outline: none;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 15px;
            width: 100%;
        }
        .btn:active { background-color: #2980b9; }
        
        .progress-bar-container {
            width: 100%;
            background-color: #ecf0f1;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .progress-bar {
            height: 100%;
            background-color: #e67e22;
            width: 100%;
            transition: width 0.1s linear;
        }

        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
        }
        .correct-text { color: #27ae60; }
        .wrong-text { color: #e74c3c; }

        .question-box {
            font-size: 56px;
            font-weight: bold;
            color: #2c3e50;
            margin: 15px 0;
            letter-spacing: 2px;
        }
        .status-msg {
            font-size: 18px;
            min-height: 28px;
            color: #7f8c8d;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .recognized-text {
            font-size: 16px;
            color: #8e44ad;
            min-height: 24px;
        }
        .hidden { display: none; }
        .warning-box {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- 設定與開始畫面 -->
    <div id="start-screen">
        <h1>九九乘法語音測驗</h1>
        
        <div id="protocol-warning" class="warning-box hidden">
            ⚠️ 提示：iOS 限制麥克風必須在 HTTPS 網頁運作。若無法語音，請透過網址（如 GitHub Pages）開啟本頁。
        </div>

        <p style="color: #7f8c8d;">共 25 題，請使用口頭語音回答。</p>
        
        <div class="setting-group">
            <label for="time-limit">每題思考時間：</label>
            <input type="number" id="time-limit" value="5" min="2" max="10"> 秒
            <div style="font-size: 13px; color: #95a5a6; margin-top: 5px;">(上限 10 秒)</div>
        </div>

        <button class="btn" onclick="initAndStart()">允許麥克風並開始</button>
    </div>

    <!-- 測驗進行畫面 -->
    <div id="quiz-screen" class="hidden">
        <div class="stats-box">
            <div>題數：<span id="current-q">1</span>/25</div>
            <div class="correct-text">對：<span id="score-correct">0</span></div>
            <div class="wrong-text">錯：<span id="score-wrong">0</span></div>
        </div>

        <div class="progress-bar-container">
            <div id="timer-bar" class="progress-bar"></div>
        </div>

        <div class="question-box" id="question-text">? × ?</div>
        <div class="status-msg" id="status-msg">請準備回答...</div>
        <div class="recognized-text" id="recognized-text"></div>
    </div>

    <!-- 結束結算畫面 -->
    <div id="result-screen" class="hidden">
        <h1>測驗完成！</h1>
        <div style="font-size: 22px; margin: 20px 0;">
            <p>答對：<span class="correct-text" id="final-correct">0</span> 題</p>
            <p>答錯：<span class="wrong-text" id="final-wrong">0</span> 題</p>
            <p>正確率：<span id="final-accuracy" style="color: #2980b9; font-weight: bold;">0%</span></p>
        </div>
        <button class="btn" onclick="resetQuiz()">重新測驗</button>
    </div>
</div>

<script>
    let currentQuestion = 0;
    const totalQuestions = 25;
    let correctCount = 0;
    let wrongCount = 0;
    let num1 = 0, num2 = 0, correctAnswer = 0;

    let timeLimit = 5;
    let timerInterval = null;
    let remainingTime = 0;
    let isAnswering = false;

    let recognition = null;

    // 檢查通訊協定
    if (window.location.protocol === 'file:') {
        document.getElementById('protocol-warning').classList.remove('hidden');
    }

    // 初始化語音辨識 (適應 iOS Safari)
    function initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("您的瀏覽器不支援語音辨識，iOS 請使用 Safari 瀏覽器。");
            return false;
        }

        if (!recognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.continuous = false; // iOS 設為 false 較穩定
            recognition.interimResults = true;

            recognition.onresult = function(event) {
                if (!isAnswering) return;

                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }

                document.getElementById('recognized-text').innerText = '聽到：' + transcript;
                let parsedNum = parseChineseNumber(transcript);

                if (parsedNum !== null) {
                    checkAnswer(parsedNum);
                }
            };

            // iOS 辨識容易自動中斷，若還在答題時間內則自動補啟動
            recognition.onend = function() {
                if (isAnswering && remainingTime > 0) {
                    try { recognition.start(); } catch(e) {}
                }
            };

            recognition.onerror = function(e) {
                console.log("語音辨識訊息：", e.error);
            };
        }
        return true;
    }

    function initAndStart() {
        if (!initSpeech()) return;

        // 取得並限制時間（最高 10 秒）
        let inputTime = parseInt(document.getElementById('time-limit').value);
        if (isNaN(inputTime) || inputTime < 2) inputTime = 2;
        if (inputTime > 10) inputTime = 10;
        timeLimit = inputTime;
        document.getElementById('time-limit').value = timeLimit;

        currentQuestion = 0;
        correctCount = 0;
        wrongCount = 0;

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');

        nextQuestion();
    }

    function nextQuestion() {
        if (currentQuestion >= totalQuestions) {
            endQuiz();
            return;
        }

        currentQuestion++;
        isAnswering = true;

        num1 = Math.floor(Math.random() * 8) + 2;
        num2 = Math.floor(Math.random() * 8) + 2;
        correctAnswer = num1 * num2;

        document.getElementById('current-q').innerText = currentQuestion;
        document.getElementById('score-correct').innerText = correctCount;
        document.getElementById('score-wrong').innerText = wrongCount;
        document.getElementById('question-text').innerText = `${num1} × ${num2}`;
        document.getElementById('status-msg').innerText = "請說出答案...";
        document.getElementById('status-msg').style.color = "#34495e";
        document.getElementById('recognized-text').innerText = "";

        // 啟動 iOS 語音辨識
        try { recognition.start(); } catch(e) {}

        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        remainingTime = timeLimit * 1000;
        
        const bar = document.getElementById('timer-bar');
        bar.style.width = '100%';

        const updateInterval = 50;
        timerInterval = setInterval(() => {
            remainingTime -= updateInterval;
            let percentage = (remainingTime / (timeLimit * 1000)) * 100;
            bar.style.width = Math.max(0, percentage) + '%';

            if (remainingTime <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, updateInterval);
    }

    function handleTimeout() {
        if (!isAnswering) return;
        isAnswering = false;
        try { recognition.stop(); } catch(e) {}

        wrongCount++;
        document.getElementById('score-wrong').innerText = wrongCount;
        document.getElementById('status-msg').innerText = `⏰ 時間到！答案是 ${correctAnswer}`;
        document.getElementById('status-msg').style.color = "#e74c3c";

        setTimeout(nextQuestion, 1500);
    }

    function checkAnswer(userAnswer) {
        if (!isAnswering) return;

        if (userAnswer === correctAnswer) {
            isAnswering = false;
            clearInterval(timerInterval);
            try { recognition.stop(); } catch(e) {}

            correctCount++;
            document.getElementById('score-correct').innerText = correctCount;
            document.getElementById('status-msg').innerText = "⭕ 答對了！";
            document.getElementById('status-msg').style.color = "#27ae60";

            setTimeout(nextQuestion, 1000);
        }
    }

    function endQuiz() {
        isAnswering = false;
        clearInterval(timerInterval);
        try { recognition.stop(); } catch(e) {}

        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');

        document.getElementById('final-correct').innerText = correctCount;
        document.getElementById('final-wrong').innerText = wrongCount;
        
        let accuracy = Math.round((correctCount / totalQuestions) * 100);
        document.getElementById('final-accuracy').innerText = accuracy + '%';
    }

    function resetQuiz() {
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    // 中文/數字語音轉換
    function parseChineseNumber(text) {
        text = text.trim();
        let digits = text.match(/\d+/);
        if (digits) return parseInt(digits[0], 10);

        const cnMap = { '零':0, '一':1, '二':2, '兩':2, '三':3, '四':4, '五':5, '六':6, '七':7, '八':8, '九':9 };
        
        if (text.includes('十')) {
            let parts = text.split('十');
            let tens = parts[0] === '' ? 1 : cnMap[parts[0]];
            let ones = parts[1] === '' ? 0 : cnMap[parts[1]];
            if (tens !== undefined && ones !== undefined) return tens * 10 + ones;
        }

        let chars = text.split('');
        if (chars.length === 2 && cnMap[chars[0]] !== undefined && cnMap[chars[1]] !== undefined) {
            return cnMap[chars[0]] * 10 + cnMap[chars[1]];
        }

        if (chars.length === 1 && cnMap[chars[0]] !== undefined) {
            return cnMap[chars[0]];
        }

        return null;
    }
</script>

</body>
</html>
